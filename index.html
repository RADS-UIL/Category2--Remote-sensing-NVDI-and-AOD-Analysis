<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orangi Town — NDVI / AOD Time Series Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="rads-map/v1/rads-map.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="rads-map/v1/rads-map.js"></script>
<style>
  /* map-specific styles only; layout comes from rads-map.css */
  #map{background:#f7f7f5}
</style>
</head>
<body>
<div id="map"></div>

<script>
  var RADS_MAP_CONFIG = {
    title: 'Orangi Town — NDVI & AOD Time Series (2013–2026)',
    search: false,
    baseLayers: [
      {id:'map', label:'Map', defaultOn:true},
      {id:'sat', label:'Satellite'}
    ],
    layers: [
      {id:'ndvi', label:'NDVI (vegetation)',        defaultOn:true,  opacity:true, opacityValue:0.75},
      {id:'aod',  label:'AOD (aerosol / PM proxy)', defaultOn:false, opacity:true, opacityValue:0.75}
    ],
    timeSlider: {min:2013, max:2026, step:1, value:2013, label:'Year'},
    legend: [
      {label:'NDVI', gradient:['red','yellow','green'], min:'Low', max:'High'},
      {label:'AOD',  gradient:['green','yellow','orange','red','purple'], min:'Clean', max:'Heavy'}
    ],
    note: 'NDVI: red = bare/low vegetation, green = dense vegetation. ' +
          'AOD: green = clean air, purple = heavy aerosol/particulate load.'
  };

  // ---- CONFIG: adjust to match your actual AOI bounding box if the overlay misaligns ----
  var AOI_BOUNDS = [
    [24.93, 66.98], // south-west [lat, lng]
    [24.99, 67.06]  // north-east [lat, lng]
  ];
  var NDVI_MIN_YEAR = 2013, NDVI_MAX_YEAR = 2026;
  var AOD_MIN_YEAR = 2013, AOD_MAX_YEAR = 2025;

  var map = L.map('map', L.extend({ zoomControl: true }, RadsMap.motionOptions())).fitBounds(AOI_BOUNDS);

  var mapLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Esri World Street Map'
  });

  var satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Esri World Imagery'
  });

  var ndviOverlay = L.imageOverlay('images/ndvi_2013.png', AOI_BOUNDS, { opacity: 0.75 });
  var aodOverlay = L.imageOverlay('images/aod_2013.png', AOI_BOUNDS, { opacity: 0 });

  ndviOverlay.addTo(map);
  aodOverlay.addTo(map);

  function setBase(sat) {
    if (sat) {
      map.removeLayer(mapLayer);
      satLayer.addTo(map);
    } else {
      map.removeLayer(satLayer);
      mapLayer.addTo(map);
    }
  }

  // state that used to live in the sidebar's checkboxes and sliders
  var ndviOn = true, aodOn = false, ndviOpacity = 0.75, aodOpacity = 0.75, year = 2013;

  function applyOpacities() {
    ndviOverlay.setOpacity(ndviOn ? ndviOpacity : 0);
    aodOverlay.setOpacity(aodOn ? aodOpacity : 0);
  }

  function updateYear() {
    var warnings = [];

    if (year >= NDVI_MIN_YEAR && year <= NDVI_MAX_YEAR) {
      ndviOverlay.setUrl('images/ndvi_' + year + '.png');
    } else {
      warnings.push('No NDVI still for ' + year);
    }

    if (year >= AOD_MIN_YEAR && year <= AOD_MAX_YEAR) {
      aodOverlay.setUrl('images/aod_' + year + '.png');
    } else if (aodOn) {
      warnings.push('No AOD still for ' + year + ' (AOD data only through ' + AOD_MAX_YEAR + ')');
    }

    RadsMap.setStatus(warnings.join(' · '));
    applyOpacities();
  }

  // A missing image is hidden rather than shown as a broken icon. The message goes to the
  // browser console for whoever maintains the page, not to visitors.
  [ndviOverlay, aodOverlay].forEach(function(o) {
    o.on('error', function() {
      var el = o.getElement(); if (el) el.style.visibility = 'hidden';
      if (window.console) console.warn('[map] missing image: ' + el.getAttribute('src'));
    });
    o.on('load', function() { var el = o.getElement(); if (el) el.style.visibility = ''; });
  });

  RadsMap.init(map, RADS_MAP_CONFIG, {
    onBase: function(id) { setBase(id === 'sat'); },
    onLayer: function(id, on) { if (id === 'ndvi') ndviOn = on; else aodOn = on; updateYear(); },
    onOpacity: function(id, v) { if (id === 'ndvi') ndviOpacity = v; else aodOpacity = v; applyOpacities(); },
    onTime: function(v) { year = v; updateYear(); }
  });
  updateYear();
</script>
</body>
</html>
